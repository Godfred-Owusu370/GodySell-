<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title & SEO Meta -->
    <title>Godysell – Your Trusted Ghanaian Marketplace &amp; Seller Hub</title>
    <meta name="description" content="Buy and sell verified products across Ghana on Godysell. Real-time marketplace with seamless seller inventory, orders, chat, and fast delivery." />
    <meta name="keywords" content="Godysell, Ghana marketplace, buy and sell Ghana, Accra shopping, online store Ghana, electronics Ghana, cars Ghana, fashion Ghana" />
    <meta name="robots" content="index, follow" />
    
    <!-- Canonical Link -->
    <link rel="canonical" href="https://www.godysell.store/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:site_name" content="Godysell" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.godysell.store/" />
    <meta property="og:title" content="Godysell – Your Trusted Ghanaian Marketplace &amp; Seller Hub" />
    <meta property="og:description" content="Buy and sell verified products across Ghana on Godysell. Real-time marketplace with seamless seller inventory, orders, chat, and fast delivery." />
    <meta property="og:image" content="https://www.godysell.store/godysell_logo.png" />
    <meta property="og:image:alt" content="Godysell Ghana Marketplace Logo" />
    <meta property="og:locale" content="en_GH" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Godysell – Your Trusted Ghanaian Marketplace &amp; Seller Hub" />
    <meta name="twitter:description" content="Buy and sell verified products across Ghana on Godysell. Real-time marketplace with seamless seller inventory, orders, chat, and fast delivery." />
    <meta name="twitter:image" content="https://www.godysell.store/godysell_logo.png" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" href="/godysell_logo.png" />
    <link rel="apple-touch-icon" href="/godysell_logo_emblem.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap" rel="stylesheet" />

    <!-- WebSite JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Godysell",
      "alternateName": [
        "GodySell",
        "GodySell Ghana",
        "Godysell Ghana"
      ],
      "url": "https://www.godysell.store/",
      "description": "Buy and sell verified products across Ghana with real-time seller inventory and buyer connections.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.godysell.store/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
